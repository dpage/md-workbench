<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380">
  <defs>
    <!-- Soft gradient background - light enough for dark text -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8ebe9"/>
      <stop offset="50%" style="stop-color:#dfe3e0"/>
      <stop offset="100%" style="stop-color:#d5dad7"/>
    </linearGradient>

    <!-- Subtle pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#5f9e72" opacity="0.15"/>
    </pattern>

    <!-- Green accent gradient for decorative elements -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5f9e72;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#6ab07f;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#5f9e72;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="540" height="380" fill="url(#bgGrad)"/>

  <!-- Subtle dot pattern -->
  <rect width="540" height="380" fill="url(#dots)"/>

  <!-- Top decorative line -->
  <rect x="120" y="50" width="300" height="2" rx="1" fill="url(#greenGrad)"/>

  <!-- App name -->
  <text x="270" y="38"
        font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
        font-size="12"
        font-weight="600"
        fill="#3d7a50"
        text-anchor="middle"
        letter-spacing="2.5">
    MARKDOWN WORKBENCH
  </text>

  <!-- Arrow between icons -->
  <g stroke="#5f9e72" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M 210 190 L 320 190" stroke-dasharray="10 6"/>
    <path d="M 310 182 L 328 190 L 310 198" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom decorative line -->
  <rect x="120" y="328" width="300" height="2" rx="1" fill="url(#greenGrad)"/>

  <!-- Instruction text -->
  <text x="270" y="355"
        font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif"
        font-size="11"
        fill="#3d7a50"
        text-anchor="middle">
    Drag to Applications to install
  </text>

  <!-- Corner accents -->
  <g stroke="#5f9e72" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 8 28 L 8 8 L 28 8"/>
    <path d="M 512 8 L 532 8 L 532 28"/>
    <path d="M 8 352 L 8 372 L 28 372"/>
    <path d="M 512 372 L 532 372 L 532 352"/>
  </g>
</svg>