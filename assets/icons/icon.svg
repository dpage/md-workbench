<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bgGradient)"/>

  <!-- Document shape with folded corner -->
  <g filter="url(#shadow)">
    <path d="M280 180 L640 180 L744 284 L744 844 L280 844 Z" fill="url(#docGradient)"/>
    <path d="M640 180 L640 284 L744 284 Z" fill="#e0e0e0"/>
  </g>

  <!-- MD text -->
  <text x="512" y="580" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="260" font-weight="700" fill="url(#bgGradient)" text-anchor="middle">MD</text>

  <!-- Markdown-style lines representing content -->
  <rect x="340" y="650" width="344" height="24" rx="12" fill="#c0c0c0"/>
  <rect x="340" y="710" width="260" height="24" rx="12" fill="#d0d0d0"/>
  <rect x="340" y="770" width="300" height="24" rx="12" fill="#d8d8d8"/>
</svg>
